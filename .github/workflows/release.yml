name: Build and publish installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GuihGuihCyber --collect-all PySide6 desktop_launcher.py
      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          choco install innosetup --yes --no-progress
          $version = $env:APP_VERSION.TrimStart('v')
          iscc "/DAppVersion=$version" packaging/windows.iss
      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GuihGuihCyber --collect-all PySide6 desktop_launcher.py
      - name: Build AppImage, DEB, and RPM
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p package-root/opt/guihguih-cyber package-root/usr/share/applications AppDir/usr/bin
          mkdir -p package-root/usr/share/icons/hicolor/256x256/apps
          install -m 0755 dist/GuihGuihCyber package-root/opt/guihguih-cyber/GuihGuihCyber
          install -m 0755 dist/GuihGuihCyber AppDir/usr/bin/GuihGuihCyber
          cp packaging/linux/guihguih-cyber.desktop package-root/usr/share/applications/
          python packaging/linux/make_icon.py package-root/usr/share/icons/hicolor/256x256/apps/guihguih-cyber.png
          cp packaging/linux/guihguih-cyber.desktop AppDir/
          python packaging/linux/make_icon.py AppDir/guihguih-cyber.png
          sed -i 's#^Exec=.*#Exec=AppRun#' AppDir/guihguih-cyber.desktop
          cp packaging/linux/AppRun AppDir/
          chmod +x AppDir/AppRun
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
          fpm -s dir -t deb -n guihguih-cyber -v "$VERSION" --architecture amd64 --description "GuihGuih Cyber desktop security scanner" -C package-root .
          fpm -s dir -t rpm -n guihguih-cyber -v "$VERSION" --architecture x86_64 --description "GuihGuih Cyber desktop security scanner" -C package-root .
          curl -fL --retry 3 -o appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "GuihGuihCyber-${VERSION}-x86_64.AppImage"
          mv ./*.deb ./*.rpm *.AppImage dist/
      - name: Create checksums
        run: (cd dist && sha256sum * > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Build macOS app bundle
        run: pyinstaller --noconfirm --clean --onedir --windowed --name GuihGuihCyber --osx-bundle-identifier com.guihinc.guihguihcyber --collect-all PySide6 desktop_launcher.py
      - name: Package DMG, PKG, and app bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent dist/GuihGuihCyber.app "dist/GuihGuihCyber-${VERSION}-macos.app.zip"
          hdiutil create -volname "GuihGuih Cyber" -srcfolder dist/GuihGuihCyber.app -ov -format UDZO "dist/GuihGuihCyber-${VERSION}-macos.dmg"
          pkgbuild --component dist/GuihGuihCyber.app --install-location /Applications --identifier com.guihinc.guihguihcyber --version "$VERSION" "dist/GuihGuihCyber-${VERSION}-macos.pkg"
      - name: Create checksums
        run: (cd dist && find . -maxdepth 1 -type f ! -name 'SHA256SUMS-macos.txt' -print0 | xargs -0 shasum -a 256 > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*

  publish:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: GuihGuih Cyber ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**


