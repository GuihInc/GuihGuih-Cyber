name: Test and build desktop

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            suffix: .exe
          - os: ubuntu-latest
            name: linux
            suffix: ""
          - os: macos-latest
            name: macos
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --noconfirm --clean --windowed --name GuihGuihCyber --collect-all PySide6 guihguih_cyber/desktop.py
      - name: Create SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('dist')
          files=[p for p in root.rglob('*') if p.is_file() and p.name != 'SHA256SUMS.txt']
          with (root/'SHA256SUMS.txt').open('w') as out:
              for p in files:
                  out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GuihGuihCyber-${{ matrix.name }}
          path: dist/**


